name: CI (checks)

# Fast, safe pre-merge checks. Deploys nothing — see supabase-deploy.yml for CD.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (pure helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run tests
        run: npm test

  edge-typecheck:
    name: Deno type-check edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Type-check every edge function entrypoint
        run: |
          set -e
          shopt -s nullglob
          failed=0
          for fn in supabase/functions/*/index.ts; do
            echo "::group::deno check $fn"
            deno check "$fn" || failed=1
            echo "::endgroup::"
          done
          exit $failed

  frontend-syntax:
    name: Frontend script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Extract inline scripts and syntax-check them
        run: node scripts/check-frontend-syntax.mjs

  workroom-dependency-audit:
    name: Workroom dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workroom-bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/workroom-bridge/package-lock.json
      - name: Activate the declared npm release
        run: |
          npm install --global npm@11.17.0 --ignore-scripts
          test "$(npm --version)" = "11.17.0"
      - name: Install the exact reviewed dependency graph
        run: npm ci --ignore-scripts
      - name: Check source and dependency advisories
        run: |
          npm run check
          npm audit --audit-level=low

  creative-library-isolation:
    name: Private creative library isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Apply twice and test unrelated owners and storage policies
        shell: pwsh
        run: ./scripts/test-creative-library-sql.ps1

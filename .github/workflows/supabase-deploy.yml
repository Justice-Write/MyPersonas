name: Deploy Supabase Edge Functions

# Owner-triggered deployment for Edge Functions. This deliberately does not run
# on push: several functions have hard schema dependencies and migrations stay
# review-only. verify_jwt per function comes from supabase/config.toml.
#
# REQUIRED repo secret: SUPABASE_ACCESS_TOKEN  (Account → Access Tokens)
# Project ref is read from supabase/config.toml (project_id).
#
# Migrations are intentionally NOT auto-applied here — they are reviewed and run
# deliberately (see CI-CD-SETUP.md). This workflow only ships function code.
on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: "Use MIGRATIONS-VERIFIED for provenance core, MIGRATIONS-AND-IMAGE-CAPTION-VERIFIED for image drafting, or PROVIDER-MIGRATIONS-VERIFIED after provider migrations 065-076 are read back"
        required: true
        type: string
      release_scope:
        description: "Deploy only this reviewed function set"
        required: true
        default: "ai-provenance"
        type: choice
        options:
          - ai-provenance
          - image-caption-drafting
          - provider-publish

permissions:
  contents: read

concurrency:
  # Serialize every production backend and Pages release. This keeps a Pages
  # approval wait from being overtaken by a newer backend deployment.
  group: production-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy functions
    environment: production
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require reviewed database release evidence
        env:
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
        run: |
          case "${RELEASE_SCOPE}" in
            ai-provenance)
              test "${RELEASE_CONFIRMATION}" = "MIGRATIONS-VERIFIED" || {
                echo "Deployment blocked: verify migration 060 in the linked ledger before AI provenance function code."
                exit 1
              }
              ;;
            image-caption-drafting)
              test "${RELEASE_CONFIRMATION}" = "MIGRATIONS-AND-IMAGE-CAPTION-VERIFIED" || {
                echo "Deployment blocked: verify migration 060 plus the exact image-caption function set and production schema dependencies."
                exit 1
              }
              ;;
            provider-publish)
              test "${RELEASE_CONFIRMATION}" = "PROVIDER-MIGRATIONS-VERIFIED" || {
                echo "Deployment blocked: verify and read back provider migrations 065 through 076 before provider function code."
                exit 1
              }
              ;;
            *)
              echo "Deployment blocked: unknown release scope."
              exit 1
              ;;
          esac
          test -n "${SUPABASE_ACCESS_TOKEN}" || {
            echo "Deployment blocked: SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          }

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate the exact source revision before deployment
        run: npm test

      - name: Read project ref from config.toml
        id: cfg
        run: |
          ref=$(grep -E '^project_id' supabase/config.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Project ref: $ref"

      - name: Deploy AI provenance core functions
        if: ${{ inputs.release_scope == 'ai-provenance' }}
        run: |
          for function_name in media-ingest gemini-image; do
            supabase functions deploy "${function_name}" --project-ref "${{ steps.cfg.outputs.ref }}"
          done

      - name: Deploy image caption drafting functions
        if: ${{ inputs.release_scope == 'image-caption-drafting' }}
        run: |
          for function_name in ai-proxy compose-post; do
            supabase functions deploy "${function_name}" --project-ref "${{ steps.cfg.outputs.ref }}"
          done

      - name: Record exact image caption backend release
        if: ${{ inputs.release_scope == 'image-caption-drafting' }}
        run: |
          mkdir -p .release-evidence
          printf 'sha=%s\nscope=image-caption-drafting\nfunctions=ai-proxy compose-post\n' "${GITHUB_SHA}" > .release-evidence/image-caption-backend.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.release_scope == 'image-caption-drafting' }}
        with:
          name: image-caption-backend-${{ github.sha }}
          path: .release-evidence/image-caption-backend.txt
          if-no-files-found: error
          retention-days: 7

      - name: Deploy reviewed provider functions
        if: ${{ inputs.release_scope == 'provider-publish' }}
        run: |
          for function_name in \
            approve-post-draft \
            meta-oauth meta-post run-post-queue \
            twitter-oauth twitter-post \
            discord-oauth discord-post \
            youtube-oauth youtube-post \
            tiktok-oauth tiktok-post \
            twitch-oauth twitch-action \
            patreon-oauth patreon-handoff \
            wix-oauth wix-draft \
            wordpress-oauth wordpress-draft \
            reddit-oauth reddit-post \
            delete-account; do
            supabase functions deploy "${function_name}" --project-ref "${{ steps.cfg.outputs.ref }}"
          done

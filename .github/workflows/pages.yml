name: Deploy site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: "Type MIGRATIONS-VERIFIED after migration 060 is recorded in the linked ledger and its smoke tests are reviewed"
        required: true
        type: string
      provider_release_confirmation:
        description: "Type PROVIDER-MIGRATIONS-VERIFIED after provider migrations 065-076 are applied, read back, and smoke-tested"
        required: true
        type: string
      image_caption_confirmation:
        description: "Type IMAGE-CAPTION-CANARY-VERIFIED after the exact backend run is read back and a signed-in private canary passes"
        required: true
        type: string
      image_caption_backend_run_id:
        description: "Successful image-caption-drafting workflow run id for this exact main commit"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  # Shares the backend release lock so the exact deployed SHA cannot be
  # replaced while this reviewed Pages release waits for approval or deploys.
  group: production-release
  queue: max
  cancel-in-progress: false

env:
  # The current version folder to publish. Bump this on major version changes.
  SITE_DIR: MyPersonas.Online_v0

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require reviewed database release evidence
        env:
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
          PROVIDER_RELEASE_CONFIRMATION: ${{ inputs.provider_release_confirmation }}
          IMAGE_CAPTION_CONFIRMATION: ${{ inputs.image_caption_confirmation }}
          IMAGE_CAPTION_BACKEND_RUN_ID: ${{ inputs.image_caption_backend_run_id }}
        run: |
          test "${RELEASE_CONFIRMATION}" = "MIGRATIONS-VERIFIED" || {
            echo "Release blocked: verify migration 060 in the linked ledger and review its smoke tests first."
            exit 1
          }
          test "${PROVIDER_RELEASE_CONFIRMATION}" = "PROVIDER-MIGRATIONS-VERIFIED" || {
            echo "Release blocked: apply and read back provider migrations 065 through 076, then review their smoke tests first."
            exit 1
          }
          test "${IMAGE_CAPTION_CONFIRMATION}" = "IMAGE-CAPTION-CANARY-VERIFIED" || {
            echo "Release blocked: read back the exact backend deployment and complete the signed-in private image-caption canary first."
            exit 1
          }
          printf '%s' "${IMAGE_CAPTION_BACKEND_RUN_ID}" | grep -Eq '^[1-9][0-9]*$' || {
            echo "Release blocked: provide the exact successful backend workflow run id."
            exit 1
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-caption-backend-${{ github.sha }}
          path: .release-evidence
          run-id: ${{ inputs.image_caption_backend_run_id }}
          github-token: ${{ github.token }}
      - name: Bind Pages to the exact deployed backend revision
        run: |
          test -f .release-evidence/image-caption-backend.txt
          grep -Fx "sha=${GITHUB_SHA}" .release-evidence/image-caption-backend.txt
          grep -Fx "scope=image-caption-drafting" .release-evidence/image-caption-backend.txt
          grep -Fx "functions=ai-proxy compose-post" .release-evidence/image-caption-backend.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate the exact source revision before packaging
        run: |
          npm test
          node scripts/check-frontend-syntax.mjs
      - name: Prepare public site artifact
        run: |
          mkdir -p .pages-artifact
          # Trailing exclude-all never enters a dir unless that dir itself is included;
          # '/foo/bar/***' does not include '/foo/', so parent includes are required.
          rsync -a --delete \
            --prune-empty-dirs \
            --include '/index.html' \
            --include '/creative-workspace.css' \
            --include '/creative-workspace.js' \
            --include '/creative-media.js' \
            --include '/owner-app.css' \
            --include '/owner-app.js' \
            --include '/image-caption-drafting.js' \
            --include '/mobile-owner-workflow.js' \
            --include '/cms-connector-ui.js' \
            --include '/persona-view.css' \
            --include '/persona-view.js' \
            --include '/platform-governance.css' \
            --include '/platform-governance.js' \
            --include '/ai-content-provenance.css' \
            --include '/ai-content-provenance.js' \
            --include '/profile-image-crop.css' \
            --include '/profile-image-crop.js' \
            --include '/agent-board.css' \
            --include '/agent-board.js' \
            --include '/assets/' \
            --include '/assets/***' \
            --include '/favicon.ico' \
            --include '/icon.svg' \
            --include '/icon-180.png' \
            --include '/icon-192.png' \
            --include '/icon-512.png' \
            --include '/icon-maskable-512.png' \
            --include '/manifest.webmanifest' \
            --include '/service-worker.js' \
            --include '/pwa.js' \
            --include '/offline.html' \
            --include '/sites.html' \
            --include '/CNAME' \
            --include '/.nojekyll' \
            --include '/robots.txt' \
            --include '/sitemap.xml' \
            --include '/privacy.html' \
            --include '/terms.html' \
            --include '/data-deletion.html' \
            --include '/provider-setup.html' \
            --include '/PROVIDER-SETUP-GUIDE.md' \
            --exclude '*' \
            "${SITE_DIR}/" .pages-artifact/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .pages-artifact
      - name: Verify backend workflow and current main immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_CAPTION_BACKEND_RUN_ID: ${{ inputs.image_caption_backend_run_id }}
        run: |
          backend_api="repos/${GITHUB_REPOSITORY}/actions/runs/${IMAGE_CAPTION_BACKEND_RUN_ID}"
          test "$(gh api "${backend_api}" --jq .head_sha)" = "${GITHUB_SHA}"
          test "$(gh api "${backend_api}" --jq .head_branch)" = "main"
          test "$(gh api "${backend_api}" --jq .event)" = "workflow_dispatch"
          test "$(gh api "${backend_api}" --jq .status)" = "completed"
          test "$(gh api "${backend_api}" --jq .conclusion)" = "success"
          gh api "${backend_api}" --jq .path | grep -Eq '^\.github/workflows/supabase-deploy\.yml@'
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "${current_main_sha}" = "${GITHUB_SHA}" || {
            echo "Release blocked: this Pages revision is no longer the current main tip."
            exit 1
          }
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

name: Deploy site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: "Type MIGRATIONS-VERIFIED after migration 060 is recorded in the linked ledger and its smoke tests are reviewed"
        required: true
        type: string
      provider_release_confirmation:
        description: "Type PROVIDER-MIGRATIONS-VERIFIED after provider migrations 065-076 are applied, read back, and smoke-tested"
        required: true
        type: string
      mobile_release_confirmation:
        description: "Type MOBILE-077-VERIFIED after migration 077 and its owner draft RPCs are applied and read back"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The current version folder to publish. Bump this on major version changes.
  SITE_DIR: MyPersonas.Online_v0

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require reviewed database release evidence
        env:
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
          PROVIDER_RELEASE_CONFIRMATION: ${{ inputs.provider_release_confirmation }}
          MOBILE_RELEASE_CONFIRMATION: ${{ inputs.mobile_release_confirmation }}
        run: |
          test "${RELEASE_CONFIRMATION}" = "MIGRATIONS-VERIFIED" || {
            echo "Release blocked: verify migration 060 in the linked ledger and review its smoke tests first."
            exit 1
          }
          test "${PROVIDER_RELEASE_CONFIRMATION}" = "PROVIDER-MIGRATIONS-VERIFIED" || {
            echo "Release blocked: apply and read back provider migrations 065 through 076, then review their smoke tests first."
            exit 1
          }
          test "${MOBILE_RELEASE_CONFIRMATION}" = "MOBILE-077-VERIFIED" || {
            echo "Release blocked: apply and verify the owner mobile private-draft contract before releasing its frontend."
            exit 1
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate the exact frontend revision before packaging
        run: |
          npm test
          node scripts/check-frontend-syntax.mjs
      - name: Prepare public site artifact
        run: |
          mkdir -p .pages-artifact
          # Trailing exclude-all never enters a dir unless that dir itself is included;
          # '/foo/bar/***' does not include '/foo/', so parent includes are required.
          rsync -a --delete \
            --prune-empty-dirs \
            --include '/index.html' \
            --include '/owner-app.css' \
            --include '/owner-app.js' \
            --include '/mobile-owner-workflow.js' \
            --include '/cms-connector-ui.js' \
            --include '/persona-view.css' \
            --include '/persona-view.js' \
            --include '/platform-governance.css' \
            --include '/platform-governance.js' \
            --include '/ai-content-provenance.css' \
            --include '/ai-content-provenance.js' \
            --include '/profile-image-crop.css' \
            --include '/profile-image-crop.js' \
            --include '/agent-board.css' \
            --include '/agent-board.js' \
            --include '/assets/' \
            --include '/assets/***' \
            --include '/favicon.ico' \
            --include '/icon.svg' \
            --include '/icon-180.png' \
            --include '/icon-192.png' \
            --include '/icon-512.png' \
            --include '/icon-maskable-512.png' \
            --include '/manifest.webmanifest' \
            --include '/service-worker.js' \
            --include '/pwa.js' \
            --include '/offline.html' \
            --include '/CNAME' \
            --include '/.nojekyll' \
            --include '/robots.txt' \
            --include '/sitemap.xml' \
            --include '/privacy.html' \
            --include '/terms.html' \
            --include '/data-deletion.html' \
            --include '/provider-setup.html' \
            --include '/PROVIDER-SETUP-GUIDE.md' \
            --exclude '*' \
            "${SITE_DIR}/" .pages-artifact/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .pages-artifact
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
